name: themis-deployment

services:
  proxy:
    image: nginx:1.29-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
      - core
      - ai

  web:
    build:
      context: ./themis-web
      args:
        VITE_API_BASE_URL: "/api/v1"
        VITE_AI_BASE_URL: "/ai"
        VITE_AI_SERVICE_TOKEN: "${AI_SERVICE_TOKEN}"

  core:
    build:
      context: ./themis-core
      dockerfile: docker/Dockerfile
    env_file:
      - path: ./themis-core/.env.example
        required: true
      - path: ./themis-core/.env
        required: false
    environment:
      AI_SERVICE_URL: http://ai:8000
      # Blockchain: Base Sepolia (testnet persistente, ver
      # themis-core/docs/despliegue-base-sepolia.md). Estos valores son
      # publicos y fijos -- se commitean, no van en .env. Los secretos
      # (RPC_URL con API key, RELAYER_PRIVATE_KEY) si van en themis-core/.env.
      CHAIN_ID: "84532"
      EXPLORER_URL: https://sepolia.basescan.org
      # Pegar lo que imprime `pnpm chain:deploy:semaphore:base-sepolia`
      # (tambien queda en themis-core/deployments/baseSepolia-semaphore.json).
      SEMAPHORE_REGISTRY_ADDRESS: "0xEd2622158C210F268C72e40061745B79E7554244"
      CHAIN_START_BLOCK: "47512755"

  ai:
    build:
      context: ./themis-ai
    env_file:
      - path: ./themis-ai/.env.example
        required: true
      - path: ./themis-ai/.env
        required: false
